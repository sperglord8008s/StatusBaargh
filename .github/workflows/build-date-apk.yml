name: Build StatusBaargh APK

on:
  push:
    branches:
      - master
      - feature/two-line-date-status-icon
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub's hosted runner already has sdkmanager; setup-android@v3
      # attempts to install the removed legacy "tools" package on newer SDKs.
      - name: Install Android API 36
        run: |
          sdkmanager_bin=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses > /dev/null || true
          "$sdkmanager_bin" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build installable debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StatusBaargh-date-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
